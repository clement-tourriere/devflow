# Cargo commands run through Mr. Boxington (requires mise 2026.8.16+).
[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[tools]
# Pin Rust to the same channel as rust-toolchain.toml for reproducible
# builds across contributors and CI. (rust-toolchain.toml still governs the
# actual toolchain selection; this just ensures mise installs a compatible
# Rust rather than "latest", which could drift ahead of the pinned channel.)
rust = "1.96.0"
# Pin the shared Cargo cache tool independently of the Rust toolchain.
"github:jdx/mr-boxington" = "1.11.0"
hk = "2.5.0"

# Note: the workspace default members are the CLI and devflow-core. The GPUI
# desktop app (devflow-gui) is built explicitly: `mise run gui:build`. On Linux
# it needs system libraries (see .github/workflows/ci.yml), so exclude it there
# with `--exclude devflow-gui`.

[tasks.build]
description = "Build the CLI and core (debug)"
run = "cargo build"

[tasks."build:release"]
description = "Build the CLI and core (release, optimized)"
run = "cargo build --release"

[tasks.test]
description = "Run unit and integration tests for the CLI and core (Docker tests are ignored)"
run = "cargo test --locked -p devflow -p devflow-core"

[tasks."test:docker"]
description = "Run the PostgreSQL integration tests that need Docker"
run = "cargo test -p devflow-core --test db_postgres -- --ignored --test-threads=1"

[tasks.check]
description = "Run cargo check (fast compile check)"
run = "cargo check --workspace"

[tasks.lint]
description = "Run clippy lints"
run = "cargo clippy --locked --workspace --all-targets -- -D warnings"

[tasks.fmt]
description = "Format code"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Check code formatting without modifying"
run = "cargo fmt --check"

[tasks.dev]
description = "Build and run devflow (debug)"
run = "cargo run --"
raw = true

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"

[tasks.gui]
description = "Run the desktop app (GPUI, debug)"
run = "cargo run -p devflow-gui"
raw = true

[tasks."gui:build"]
description = "Build the desktop app (release binary: target/release/devflow-gui)"
run = "cargo build --release -p devflow-gui"

[tasks.ci]
description = "Run the CI checks locally (fmt check + clippy + tests)"
run = """
cargo fmt --check
cargo clippy --locked --workspace --all-targets -- -D warnings
cargo test --locked -p devflow -p devflow-core
"""

[tasks.install]
description = "Build release and install the CLI to ~/.cargo/bin"
run = "cargo install --path . --locked"

[tasks."release:dry-run"]
description = "Preview next Commitizen release bump"
run = "sh -c 'cz bump --dry-run --yes --allow-no-commit --increment PATCH || test $? -eq 3'"

[tasks.release]
description = "Create release commit, changelog, and tag via Commitizen"
run = "cz bump --yes --allow-no-commit --increment PATCH"
