# devflow.toml: committed at the repository root. `devflow init` proposes the
# content from what the repository contains; this file shows the options most
# projects use.
# Machine-local overrides go in a git-ignored devflow.local.toml beside it. It
# overlays every section, [hooks] and [env] included, and trust covers the merged result.

[project]
name = "shop"
# Generated by `devflow init`. Keep it stable and committed: it ties trust,
# the registry and the database server to this project across machines.
# The value below is a placeholder shared by the examples: replace it with the id
# `devflow init` writes for your project. A copied id makes two projects share one
# database server and one registry entry.
id = "0b3c9d2e-7f4a-4c1e-9a52-6d1f3b8e2a40"

[worktree]
# Parent directory for new worktrees. {project} and {repo} expand. It is relative
# to the main checkout; absolute and ~/ paths work too. Each worktree is a
# subdirectory named after the workspace with unsafe characters replaced
# (agent/a -> agent-a); `workspace.path` in --json output is authoritative.
dir = "../{project}.worktrees"
# Ignored paths cloned (copy-on-write where the filesystem allows) from the
# source worktree into each new one. Nothing is copied unless listed here.
# Paths are relative and must stay inside the worktree.
copy = [".env", "node_modules"]

[services.db]
engine = "postgres"
# devflow runs a PostgreSQL container with `docker compose`. Needs Docker.
mode = "managed"
image = "postgres:18"            # must be PostgreSQL 18 or newer
database = "shop"                # logical name of the default workspace's database
# bind = "127.0.0.1"             # IP address (not a hostname) the container port is published on
# port = 0                       # fixed host port. 0 (default): devflow picks one in 20000-39999 on the first start,
#                                # records it and keeps it; a different number overrides that
# On OrbStack the server is also reachable from other containers as db.<project>-<id8>.devflow.orb.local:5432
# (`devflow db status` prints it); DATABASE_URL stays on 127.0.0.1.
# on_busy_source = "disconnect"  # clone a database that has open sessions: "disconnect" ends them
#                                # (default for managed on loopback), "fail" refuses (default otherwise)
require_cow = false              # true: refuse to create a branch unless CoW is verified
# Scratch databases: every branch gets these besides its own, empty and recorded, for test
# runners and migration shadow schemas (branch logins cannot create databases). Exported as
# <NAME>_DATABASE_URL (TEST_DATABASE_URL, SHADOW_DATABASE_URL) with the branch's login and password.
# Names: ^[a-z][a-z0-9_]{0,20}$, unique, not main, postgres, devflow or template*. A clone gets
# empty ones; `devflow db reset` empties them again; removing a name leaves its database as an
# orphan that `devflow db reconcile --drop-orphans` drops.
# extra_databases = ["test", "shadow"]

# A cache or queue of its own for every workspace: a Valkey (or Redis) container cloned
# copy-on-write from its source's data, on its own 127.0.0.1 port and with its own password.
# The URL is exported as REDIS_URL (redis://:<password>@127.0.0.1:<port>/0); it is a secret.
# Managed only: devflow runs the container. Needs Docker; reflink needs volumes on btrfs/XFS (OrbStack).
# `devflow init` proposes this table for a compose service with a valkey/valkey or redis image.
# [services.cache]
# engine = "valkey"              # valkey | redis
# image = "valkey/valkey:8-alpine"  # default per engine (redis: "redis:8-alpine"); pinned per branch by digest
# env = "REDIS_URL"              # the variable the URL is exported as; two services cannot share one
# require_cow = false            # true: refuse a clone unless the volumes share blocks (otherwise a full copy is reported as `copy`)
# Manage with `devflow service cache status|up|down|url|snapshot create|reset|reconcile` (NAME may be left out when there is one).

# A MySQL 8.4 database of its own for every workspace (preview), cloned copy-on-write from its
# source's data. A clone shuts the source down cleanly for a few seconds while its data directory
# is reflinked, then starts it again (`devflow service sql status` reports that downtime), so
# clients of the source must reconnect. The URL is exported as DATABASE_URL (MYSQL_URL beside a
# postgres service, as here) with MYSQL_HOST, MYSQL_PORT, MYSQL_USER, MYSQL_PASSWORD and
# MYSQL_DATABASE; it is a secret. One mysql service per project for now. Managed only; needs Docker.
# [services.sql]
# engine = "mysql"               # MySQL 8.4, standalone InnoDB (the only profile)
# image = "mysql:8.4"            # pinned per branch by digest
# database = "shop"              # default: the project name as an identifier
# env = "MYSQL_URL"              # the variable the URL is exported as; default DATABASE_URL, or MYSQL_URL beside postgres
# require_cow = false            # true: refuse a clone unless the volumes share blocks

[pitchfork]
# Start the workspace's pitchfork daemons when `devflow setup` or `devflow switch`
# leaves it ready (default false; `devflow init` proposes it). They start only if
# the worktree's pitchfork.toml is the one `devflow trust` approved and no daemon
# starts on its own (cron, watch, boot_start, auto). Otherwise use `devflow up`.
# autostart = true

[hooks]
# Shell commands (sh -c) run in the new worktree with .devflow/env applied:
# DATABASE_URL, the PG* variables, the [env] recipes below and DEVFLOW_*
# identifiers. They need approval: run `devflow trust` once, or set
# DEVFLOW_TRUST_HOOKS=1 for a single run. Write them so that running them twice
# is safe.
#
# An entry is a string, or a table when it deserves a name in logs and output
# or its own timeout: { name = "...", run = "...", timeout = "5m" }.
#
# A command that needs this workspace's database goes through `devflow exec`,
# which sets .devflow/env after mise has set its own environment. Under
# `mise exec` alone, a mise.local.toml, a `[env]` key, MISE_ENV or a mise.toml
# in a subdirectory can hand the command another database. A new worktree's
# mise configuration must be trusted (`mise trust`, or `trusted_config_paths`)
# before the first hook; `devflow doctor` lists the options and devflow never
# trusts it for you.
setup = [
  "mise install",
  "mise exec -- devflow exec -- bun install",
  { name = "migrate", run = "mise exec -- devflow exec -- bun run db:migrate", timeout = "5m" },
]
switch = []                # every `devflow switch` into an existing ready workspace, and once after `switch -c` reaches ready
teardown = []              # before removal; a failure blocks removal unless --force
timeout = "15m"            # per command, unless the entry sets its own

[env]
# Extra variables for .devflow/env (and hooks). A value may use ${NAME} to
# reference variables devflow generates (DATABASE_URL, PGHOST, PGPORT, PGUSER,
# PGPASSWORD, PGDATABASE, DEVFLOW_WORKSPACE, COMPOSE_PROJECT_NAME, ...), once and
# nothing else: no defaults, no other recipe. A value built from the database
# password is secret: masked in output and logs, written only to the 0600 file.
# Recipes and presets are part of what `devflow trust` approves.
DIRECT_URL = "${DATABASE_URL}"
API_ORIGIN = "http://localhost:3000"
# Presets render typed fields from the database's connection parameters:
#   prisma      DIRECT_URL                                   (conflicts with a recipe of that name; SHADOW_DATABASE_URL
#                                                             is exported with extra_databases = ["shadow"])
#   laravel     DB_CONNECTION, DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD
#   spring      SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD
#   sqlalchemy  SQLALCHEMY_DATABASE_URI                      (postgresql+psycopg://, percent-encoded)
#   db_parts    DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# A preset that sets a name already set by another preset or a recipe is an error.
# presets = ["spring"]
