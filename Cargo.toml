[workspace]
members = [".", "crates/devflow-core", "crates/devflow-gui"]
# The GUI pulls in GPUI; build it explicitly with `cargo build -p devflow-gui`.
default-members = [".", "crates/devflow-core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
authors = ["Clément Tourrière <clement.tourriere@gmail.com>"]
license = "MIT"
repository = "https://github.com/clement-tourriere/devflow"

[workspace.dependencies]
devflow-core = { path = "crates/devflow-core" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.22", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tempfile = "3.27"

[package]
name = "devflow"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
description = "Git worktrees with copy-on-write payloads, instant Postgres branches, and setup hooks"
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "devflow"
path = "src/main.rs"

[dependencies]
devflow-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.6"
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }

[dev-dependencies]
tempfile.workspace = true
git2 = { version = "0.21", default-features = false }

[profile.release]
# Day-to-day optimized builds (local `mise run install`, `mise run gui:build`).
# Thin LTO keeps rebuilds minutes faster than fat LTO for a few % binary size;
# shipped binaries use the `dist` profile below.
opt-level = "s"        # Optimize for size with better runtime performance than "z"
lto = "thin"
codegen-units = 16
panic = "abort"        # Abort on panic instead of unwinding
strip = true           # Strip symbols and debug info
overflow-checks = false # Disable overflow checks for smaller binary
debug-assertions = false # Disable debug assertions
incremental = false    # Disable incremental compilation

# Shipping profile (CI release builds): aggressive size optimization
[profile.dist]
inherits = "release"
lto = "fat"            # Fat Link Time Optimization for maximum size reduction
codegen-units = 1      # Reduce parallel code generation units

[profile.dev]
# Keep development builds fast
opt-level = 0
debug = true
split-debuginfo = "unpacked"  # Skip dsymutil on macOS, saves 1-5s per incremental build
