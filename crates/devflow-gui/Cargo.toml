[package]
name = "devflow-gui"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
description = "devflow desktop app (GPUI)"
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "devflow-gui"
path = "src/main.rs"

[dependencies]
devflow-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
toml = "0.9"
# Pinned exactly: GPUI snapshots move together and break source compatibility.
gpui-kit = { version = "=0.7.1", features = ["tree-sitter-toml"] }

[dev-dependencies]
tempfile.workspace = true
# Headless window tests (`gpui_kit::test`) need GPUI's test platform.
gpui-kit = { version = "=0.7.1", features = ["tree-sitter-toml", "test-support"] }
