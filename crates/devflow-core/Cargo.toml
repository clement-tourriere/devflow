[package]
name = "devflow-core"
version = "0.6.0"
edition = "2021"
description = "Core library for devflow — services, config, hooks, VCS, and state management"
authors = ["Clément Tourrière <clement.tourriere@gmail.com>"]
license = "MIT"

[features]
default = ["service-local", "service-neon", "service-dblab", "service-xata", "llm"]
service-local = ["dep:bollard", "dep:rusqlite", "dep:rust-s3", "dep:tar", "dep:bytes", "dep:tempfile", "dep:url"]
service-neon = []
service-dblab = []
service-xata = []
llm = []

[dependencies]
# Serialization
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_yaml_ng = { version = "0.10", default-features = false }
serde_json = "1.0"
toml = { version = "0.8", default-features = false, features = ["parse"] }

# Async runtime
tokio = { version = "1.46", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "macros", "process", "fs"] }

# Error handling
anyhow = "1.0"

# Async trait support
async-trait = "0.1"

# Git operations
git2 = { version = "0.21", default-features = false }

# Text matching
# Full default features: workspace matching patterns use \b/\s,
# which require the unicode feature to compile.
regex = "1.12"

# Template engine for hooks
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }

# File system
dirs = { version = "6.0", default-features = false }

# Logging
log = { version = "0.4", default-features = false, features = ["release_max_level_off"] }

# Date/time handling
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# SQLite for local backend state
rusqlite = { version = "0.40", default-features = false, features = ["bundled"], optional = true }

# UUID generation
uuid = { version = "1.22", features = ["v4", "serde"] }

# HTTP client for cloud backends
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# URL parsing
url = { version = "2.5", optional = true }

# S3 support for data seeding
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"], optional = true }

# Temp files
tempfile = { version = "3.27", optional = true }

# Docker Engine API client
bollard = { version = "0.21", default-features = false, features = ["ssl", "pipe"], optional = true }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Tar archive creation (for bollard upload_to_container)
tar = { version = "0.4", default-features = false, optional = true }

which = "8.0.0"

# Terminal UI for interactive selection
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }

# Ordered maps for deterministic hook execution
indexmap = { version = "2", default-features = false, features = ["serde"] }

# Direct Rust embedding of Pitchfork's supervisor/log APIs for process runtime
pitchfork-cli = { version = "=2.14.0", default-features = false }

# Cross-platform Copy-on-Write file copies (APFS clonefile, ioctl FICLONE, ReFS)
reflink-copy = "0.1"

# Work-stealing parallelism for directory copies
rayon = "1.12"

# Process file watchers use glob patterns for watch sets
glob = "0.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process", "user"] }

