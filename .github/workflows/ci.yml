name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Verify version sync targets
        run: |
          VERSION=$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path('.cz.toml').open('rb') as fp:
              print(tomllib.load(fp)['tool']['commitizen']['version'])
          PY
          )
          python3 scripts/sync-version.py "$VERSION"
          git diff --exit-code

      - name: Check Conventional Commits
        if: github.event_name == 'pull_request'
        run: |
          python3 -m pip install commitizen
          cz check --rev-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2'

      - name: Build frontend
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build
          bun test tests

      - name: Build documentation
        working-directory: docs-site
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Check generated LLM documentation
        run: ./scripts/generate-llms-txt.sh --check

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --workspace

      - name: Test
        run: cargo test --locked --workspace

      - name: Security audit
        run: |
          cargo install cargo-audit --quiet --locked
          cargo audit

  docker-integration-tests:
    name: Docker Integration Tests
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Build devflow-core
        run: cargo build --locked -p devflow-core

      - name: Run shared-provider integration tests (requires Docker)
        run: cargo test --locked -p devflow-core --test shared_integration --test review_regressions -- --ignored --test-threads=1

  zfs-integration-tests:
    name: ZFS replacement failure recovery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install ZFS
        run: |
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs
      - name: Exercise a disposable pool
        run: |
          cargo test --locked -p devflow-core --lib --no-run --message-format=json > /tmp/devflow-zfs-build.jsonl
          test_bin=$(python3 -c 'import json; print(next(x["executable"] for l in open("/tmp/devflow-zfs-build.jsonl") if (x := json.loads(l)).get("executable") and x.get("profile", {}).get("test")))')
          pool="devflow_ci_${GITHUB_RUN_ID}"
          disk=$(mktemp /tmp/devflow-zfs.XXXXXX)
          truncate -s 2G "$disk"
          trap 'sudo zpool destroy "$pool"; rm -f "$disk"' EXIT
          sudo zpool create -o cachefile=none -O mountpoint=none "$pool" "$disk"
          sudo env PATH=/nonexistent DEVFLOW_TEST_ZFS_POOL="$pool" "$test_bin" linux_zfs_failures_preserve_mounted_data --ignored --nocapture

  feature-builds:
    name: CLI feature builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["--no-default-features", "", "--all-features"]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p devflow -p devflow-core ${{ matrix.features }}
      - name: Check generated provider catalog
        if: matrix.features == '--all-features'
        run: cargo run -p devflow-core --example generate_provider_manifest -- --check

  coverage:
    name: Coverage
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage report
        run: cargo llvm-cov --locked -p devflow -p devflow-core -p devflow-proxy --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  install-script:
    name: Install script
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is exercised post-release only (verify-install):
        # the latest published release may not have an arm64 asset yet.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Lint with shellcheck
        if: runner.os == 'Linux'
        run: >-
          shellcheck
          scripts/install.sh
          scripts/integration-test.sh
          scripts/generate-llms-txt.sh
          examples/agent-bootstrap.sh
          examples/agent-task.sh

      - name: Install latest release
        run: sh scripts/install.sh

      - name: Verify installed binary
        run: |
          "$HOME/.local/bin/devflow" --version
          "$HOME/.local/bin/devflow" --help > /dev/null

      - name: Install pinned version into custom dir
        run: |
          DEVFLOW_VERSION=v0.5.0 DEVFLOW_INSTALL_DIR="$RUNNER_TEMP/devflow-bin" sh scripts/install.sh
          "$RUNNER_TEMP/devflow-bin/devflow" --version | grep -F "0.5.0"

  # NOTE: macOS integration tests are disabled because GitHub Actions macOS
  # runners do not ship with Docker. The Colima-based workaround is slow and
  # flaky (~3-5 min startup, frequent timeouts). Re-enable when GitHub offers
  # native Docker support on macOS runners, or when a faster alternative
  # (e.g., OrbStack in CI) becomes viable.
  #
  # The APFS clone storage backend is still tested manually on macOS.
  # The macOS release binary is built without integration tests (see release job).
  integration-macos:
    name: Integration (macOS / APFS)
    needs: build-and-test
    if: ${{ false }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Set up Docker
        run: |
          brew install docker colima
          colima start
          # Wait for Docker to be ready
          for i in $(seq 1 30); do
            if docker info &>/dev/null 2>&1; then
              echo "Docker is ready"
              break
            fi
            sleep 2
          done
          docker version

      - name: Pull postgres image
        run: docker pull postgres:17

      - name: Run integration tests
        env:
          EXPECTED_STORAGE: apfs_clone
          DEVFLOW_BIN: ${{ github.workspace }}/target/debug/devflow
        run: ./scripts/integration-test.sh

  integration-linux-zfs:
    name: Integration (Linux / ZFS)
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Install ZFS
        run: |
          sudo apt-get update
          sudo apt-get install -y zfsutils-linux
          sudo modprobe zfs

      - name: Set up ZFS pool
        run: |
          sudo mkdir -p /var/lib/devflow/data
          sudo truncate -s 2G /var/lib/devflow/pgdata.img
          sudo zpool create -m /var/lib/devflow/data devflow /var/lib/devflow/pgdata.img
          sudo zfs set compression=lz4 recordsize=8k devflow
          sudo chown "$(id -u):$(id -g)" /var/lib/devflow/data
          sudo zfs allow "$(id -un)" create,destroy,snapshot,clone,mount,mountpoint,promote,rename,rollback devflow

      - name: Redirect devflow data to ZFS
        run: |
          mkdir -p ~/.local/share
          rm -rf ~/.local/share/devflow
          ln -s /var/lib/devflow/data ~/.local/share/devflow

      - name: Pull postgres image
        run: docker pull postgres:17

      - name: Run integration tests
        env:
          EXPECTED_STORAGE: zfs
          DEVFLOW_ZFS_DATASET: devflow
        run: |
          RUNNER_HOME="$HOME"
          sudo \
            HOME="$RUNNER_HOME" \
            XDG_DATA_HOME="$RUNNER_HOME/.local/share" \
            EXPECTED_STORAGE="$EXPECTED_STORAGE" \
            DEVFLOW_ZFS_DATASET="$DEVFLOW_ZFS_DATASET" \
            DEVFLOW_BIN="$GITHUB_WORKSPACE/target/debug/devflow" \
            bash ./scripts/integration-test.sh

  integration-linux-xfs:
    name: Integration (Linux / XFS reflink)
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Set up XFS with reflink
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs
          sudo truncate -s 2G /tmp/xfs.img
          sudo mkfs.xfs -m reflink=1 /tmp/xfs.img
          sudo mkdir -p /mnt/devflow-xfs
          sudo mount -o loop /tmp/xfs.img /mnt/devflow-xfs
          sudo chown -R $(whoami):$(whoami) /mnt/devflow-xfs

      - name: Redirect devflow data to XFS
        run: |
          mkdir -p ~/.local/share
          ln -sf /mnt/devflow-xfs ~/.local/share/devflow

      - name: Pull postgres image
        run: docker pull postgres:17

      - name: Run integration tests
        env:
          EXPECTED_STORAGE: reflink
          DEVFLOW_BIN: ${{ github.workspace }}/target/debug/devflow
        run: ./scripts/integration-test.sh

  integration-linux-btrfs:
    name: Integration (Linux / Btrfs reflink)
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Set up Btrfs
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs
          sudo truncate -s 2G /tmp/btrfs.img
          sudo mkfs.btrfs /tmp/btrfs.img
          sudo mkdir -p /mnt/devflow-btrfs
          sudo mount -o loop /tmp/btrfs.img /mnt/devflow-btrfs
          sudo chown -R $(whoami):$(whoami) /mnt/devflow-btrfs

      - name: Redirect devflow data to Btrfs
        run: |
          mkdir -p ~/.local/share
          ln -sf /mnt/devflow-btrfs ~/.local/share/devflow

      - name: Pull postgres image
        run: docker pull postgres:17

      - name: Run integration tests
        env:
          EXPECTED_STORAGE: reflink
          DEVFLOW_BIN: ${{ github.workspace }}/target/debug/devflow
        run: ./scripts/integration-test.sh

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs:
      - docker-integration-tests
      - feature-builds
      - zfs-integration-tests
      - integration-linux-zfs
      - integration-linux-xfs
      - integration-linux-btrfs
    runs-on: ${{ matrix.os }}
    env:
      COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: devflow-linux-amd64
          - os: ubuntu-24.04-arm
            artifact_name: devflow-linux-arm64
          - os: macos-latest
            artifact_name: devflow-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y mold

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Install bun
        if: runner.os != 'Linux' || matrix.artifact_name != 'devflow-linux-arm64'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2'

      - name: Build Tauri frontend
        if: runner.os != 'Linux' || matrix.artifact_name != 'devflow-linux-arm64'
        run: |
          cd ui && bun install --frozen-lockfile && bun run build

      - name: Create frontend stub (ARM64 Linux — bun unavailable)
        if: runner.os == 'Linux' && matrix.artifact_name == 'devflow-linux-arm64'
        run: mkdir -p ui/dist && touch ui/dist/index.html

      - name: Build release binary
        run: |
          cargo build --locked --profile dist --bin devflow
          cargo build --locked --profile dist --no-default-features --features proxy --bin devflow-proxy
        env:
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=mold' || '' }}

      - name: Smoke test release binary
        run: |
          ./target/dist/devflow --version
          ./target/dist/devflow --help > /dev/null
          ./target/dist/devflow-proxy --version
          ./target/dist/devflow-proxy proxy --help > /dev/null

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/dist/devflow dist/${{ matrix.artifact_name }}
          chmod +x dist/${{ matrix.artifact_name }}
          cp target/dist/devflow-proxy dist/${{ matrix.artifact_name }}-proxy
          chmod +x dist/${{ matrix.artifact_name }}-proxy

      - name: Generate SHA256 checksums
        run: |
          cd dist
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
            sha256sum ${{ matrix.artifact_name }}-proxy > ${{ matrix.artifact_name }}-proxy.sha256
          else
            shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
            shasum -a 256 ${{ matrix.artifact_name }}-proxy > ${{ matrix.artifact_name }}-proxy.sha256
          fi
          cat ${{ matrix.artifact_name }}.sha256

      - name: Install cosign (for signing)
        if: env.COSIGN_KEY != ''
        uses: sigstore/cosign-installer@v3

      - name: Sign release assets with cosign
        if: env.COSIGN_KEY != ''
        run: |
          cosign sign-blob --yes --key env://COSIGN_KEY \
            dist/${{ matrix.artifact_name }} \
            --output-signature dist/${{ matrix.artifact_name }}.sig \
            --output-certificate dist/${{ matrix.artifact_name }}.pem
          cosign sign-blob --yes --key env://COSIGN_KEY \
            dist/${{ matrix.artifact_name }}-proxy \
            --output-signature dist/${{ matrix.artifact_name }}-proxy.sig \
            --output-certificate dist/${{ matrix.artifact_name }}-proxy.pem

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.sha256
            dist/${{ matrix.artifact_name }}.sig
            dist/${{ matrix.artifact_name }}.pem
            dist/${{ matrix.artifact_name }}-proxy
            dist/${{ matrix.artifact_name }}-proxy.sha256
            dist/${{ matrix.artifact_name }}-proxy.sig
            dist/${{ matrix.artifact_name }}-proxy.pem
          body_path: docs/releases/${{ github.ref_name }}.md

  verify-install:
    name: Verify install script
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install just-released version
        run: DEVFLOW_VERSION="${{ github.ref_name }}" DEVFLOW_INSTALL_PROXY=1 sh scripts/install.sh

      - name: Verify installed version matches tag
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          installed="$(devflow --version | awk '{print $2}')"
          expected="${GITHUB_REF_NAME#v}"
          if [ "$installed" != "$expected" ]; then
            echo "Installed version '$installed' does not match tag '$expected'" >&2
            exit 1
          fi
          devflow --version
          proxy_installed="$(devflow-proxy --version | awk '{print $2}')"
          test "$proxy_installed" = "$expected"
          devflow-proxy proxy --help > /dev/null
