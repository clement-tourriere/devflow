name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux: everything except the GPUI desktop app, which needs a graphics stack
  # (Wayland/X11, Vulkan, fontconfig, ...) and is built on macOS below.
  build-and-test:
    name: Build & Test (Linux, without GUI)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Verify version sync targets
        run: |
          VERSION=$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path('.cz.toml').open('rb') as fp:
              print(tomllib.load(fp)['tool']['commitizen']['version'])
          PY
          )
          python3 scripts/sync-version.py "$VERSION"
          git diff --exit-code

      - name: Check Conventional Commits
        if: github.event_name == 'pull_request'
        run: |
          python3 -m pip install commitizen
          cz check --rev-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --exclude devflow-gui --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --workspace --exclude devflow-gui

      - name: Test
        run: cargo test --locked -p devflow -p devflow-core

      - name: Security audit
        run: |
          cargo install cargo-audit --quiet --locked
          cargo audit

  # Real PostgreSQL 18 in Docker (the tests are #[ignore]d by default).
  #
  # GitHub's Linux runners use ext4, which cannot share blocks, so branches are
  # created as full copies and devflow reports CoW as `copy`. These tests must
  # not assert `verified` here. Do NOT set DEVFLOW_EXPECT_COW on this job: that
  # variable is only for runs on OrbStack or a btrfs/XFS host.
  docker-tests:
    name: Docker PostgreSQL tests
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Pull PostgreSQL image
        run: docker pull postgres:18

      - name: Run database integration tests (requires Docker)
        run: cargo test --locked -p devflow-core --test db_postgres -- --ignored --test-threads=1

  # macOS runs the CLI and core tests (APFS clonefile paths) and is the only
  # place the GPUI desktop app is built. GitHub's macOS runners have no Docker,
  # so the database tests stay on Linux.
  macos:
    name: macOS (APFS, GUI)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Test CLI and core
        run: cargo test --locked -p devflow -p devflow-core

      - name: Clippy (GUI)
        run: cargo clippy --locked -p devflow-gui --all-targets -- -D warnings

      - name: Build GUI
        run: cargo build --locked -p devflow-gui

      - name: Test GUI
        run: cargo test --locked -p devflow-gui

  coverage:
    name: Coverage
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage report
        run: cargo llvm-cov --locked -p devflow -p devflow-core --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  install-script:
    name: Install script
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is exercised post-release only (verify-install):
        # the latest published release may not have an arm64 asset yet.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Lint with shellcheck
        if: runner.os == 'Linux'
        run: >-
          shellcheck
          scripts/install.sh
          examples/agent-task.sh

      - name: Install latest release
        run: sh scripts/install.sh

      - name: Verify installed binary
        run: |
          "$HOME/.local/bin/devflow" --version
          "$HOME/.local/bin/devflow" --help > /dev/null

      - name: Install pinned version into custom dir
        run: |
          DEVFLOW_VERSION=v0.5.0 DEVFLOW_INSTALL_DIR="$RUNNER_TEMP/devflow-bin" sh scripts/install.sh
          "$RUNNER_TEMP/devflow-bin/devflow" --version | grep -F "0.5.0"

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs:
      - build-and-test
      - docker-tests
      - macos
    runs-on: ${{ matrix.os }}
    env:
      COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: devflow-linux-amd64
          - os: ubuntu-24.04-arm
            artifact_name: devflow-linux-arm64
          - os: macos-latest
            artifact_name: devflow-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # Only the `devflow` CLI is released as a binary. The desktop app
      # (devflow-gui) is built from source.
      - name: Build release binary
        run: cargo build --locked --profile dist -p devflow --bin devflow
        env:
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=mold' || '' }}

      - name: Smoke test release binary
        run: |
          ./target/dist/devflow --version
          ./target/dist/devflow --help > /dev/null

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/dist/devflow dist/${{ matrix.artifact_name }}
          chmod +x dist/${{ matrix.artifact_name }}

      - name: Generate SHA256 checksums
        run: |
          cd dist
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          fi
          cat ${{ matrix.artifact_name }}.sha256

      - name: Install cosign (for signing)
        if: env.COSIGN_KEY != ''
        uses: sigstore/cosign-installer@v3

      - name: Sign release assets with cosign
        if: env.COSIGN_KEY != ''
        run: |
          cosign sign-blob --yes --key env://COSIGN_KEY \
            dist/${{ matrix.artifact_name }} \
            --output-signature dist/${{ matrix.artifact_name }}.sig \
            --output-certificate dist/${{ matrix.artifact_name }}.pem

      # Commitizen writes "## vX.Y.Z (date)" sections into CHANGELOG.md.
      - name: Extract release notes
        shell: bash
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## / {
              if (found) exit
              if (index($0, "## " tag " ") == 1 || $0 == "## " tag) found = 1
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md for the changes in ${GITHUB_REF_NAME}." > release-notes.md

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.sha256
            dist/${{ matrix.artifact_name }}.sig
            dist/${{ matrix.artifact_name }}.pem
          body_path: release-notes.md

  verify-install:
    name: Verify install script
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install just-released version
        run: DEVFLOW_VERSION="${{ github.ref_name }}" sh scripts/install.sh

      - name: Verify installed version matches tag
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          installed="$(devflow --version | awk '{print $2}')"
          expected="${GITHUB_REF_NAME#v}"
          if [ "$installed" != "$expected" ]; then
            echo "Installed version '$installed' does not match tag '$expected'" >&2
            exit 1
          fi
          devflow --version
