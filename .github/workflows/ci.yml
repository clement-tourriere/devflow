name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Runs the installer smoke test against a published release.
  workflow_dispatch:
    inputs:
      version:
        description: Published release tag the installer smoke test installs (for example v1.0.0)
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The pre-push secret scan, for pushes and pull requests made without the
  # hooks: every commit and commit message after the audited commit in
  # scripts/kingfisher.sh, plus the annotation of a pushed tag. Every other job
  # waits for it: a failing scan builds, lints and publishes nothing.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5
        with:
          install_args: kingfisher jq

      - name: Scan with kingfisher
        run: |
          ref=HEAD
          case "$GITHUB_REF" in refs/tags/*) ref=$GITHUB_REF ;; esac
          echo "$ref $(git rev-parse "$ref") $ref 0" | sh scripts/kingfisher.sh pushed

  # Linux: everything except the GPUI desktop app, which needs a graphics stack
  # (Wayland/X11, Vulkan, fontconfig, ...) and is built on macOS below.
  build-and-test:
    name: Build & Test (Linux, without GUI)
    needs: secrets
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Verify version sync targets
        run: |
          VERSION=$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path('.cz.toml').open('rb') as fp:
              print(tomllib.load(fp)['tool']['commitizen']['version'])
          PY
          )
          python3 scripts/sync-version.py "$VERSION"
          git diff --exit-code

      - name: Check Conventional Commits
        if: github.event_name == 'pull_request'
        run: |
          python3 -m pip install commitizen
          cz check --rev-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --exclude devflow-gui --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --workspace --exclude devflow-gui

      - name: Test
        run: cargo test --locked -p devflow -p devflow-core

      - name: Security audit
        run: |
          cargo install cargo-audit --quiet --locked
          cargo audit

  # Real PostgreSQL 18 in Docker (the tests are #[ignore]d by default).
  #
  # GitHub's Linux runners use ext4, which cannot share blocks, so branches are
  # created as full copies and devflow reports CoW as `copy`. These tests must
  # not assert `verified` here. Do NOT set DEVFLOW_EXPECT_COW on this job: that
  # variable is only for runs on OrbStack or a btrfs/XFS host.
  docker-tests:
    name: Docker PostgreSQL tests
    needs: secrets
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Pull PostgreSQL image
        run: docker pull postgres:18

      - name: Run database integration tests (requires Docker)
        run: cargo test --locked -p devflow-core --test db_postgres -- --ignored --test-threads=1

  # Valkey/Redis and MySQL containers, their clones, snapshots and recovery. The
  # tests label what they create and remove it themselves; timeouts bound a
  # hung Docker call so the job fails instead of waiting for the runner limit.
  # ext4 cannot share blocks: like the PostgreSQL job, these must not assert
  # `verified` CoW (DEVFLOW_EXPECT_COW stays unset).
  docker-services-tests:
    name: Docker service tests (${{ matrix.suite }})
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: Valkey/Redis
            test: services_docker
            images: valkey/valkey:8-alpine redis:8-alpine debian:stable-slim
          - suite: MySQL
            test: services_mysql_docker
            images: mysql:8.4 debian:stable-slim
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Pull images
        run: |
          for image in ${{ matrix.images }}; do
            docker pull "$image"
          done

      - name: Run ${{ matrix.suite }} integration tests (requires Docker)
        timeout-minutes: 20
        run: >-
          timeout --kill-after=30s 18m
          cargo test --locked -p devflow --test ${{ matrix.test }}
          -- --ignored --test-threads=1

  # macOS runs the CLI and core tests (APFS clonefile paths) and is the only
  # place the GPUI desktop app is built. GitHub's macOS runners have no Docker,
  # so the database tests stay on Linux.
  macos:
    name: macOS (APFS, GUI)
    needs: secrets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Test CLI and core
        run: cargo test --locked -p devflow -p devflow-core

      - name: Clippy (GUI)
        run: cargo clippy --locked -p devflow-gui --all-targets -- -D warnings

      - name: Build GUI
        run: cargo build --locked -p devflow-gui

      - name: Test GUI
        run: cargo test --locked -p devflow-gui

  coverage:
    name: Coverage
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage report
        run: cargo llvm-cov --locked -p devflow -p devflow-core --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  install-script:
    name: Install script
    needs: secrets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is exercised post-release only (verify-install):
        # the latest published release may not have an arm64 asset yet.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Lint with shellcheck
        if: runner.os == 'Linux'
        run: >-
          shellcheck
          scripts/install.sh
          scripts/kingfisher.sh
          scripts/smoke-test.sh
          scripts/bench-workspaces.sh
          examples/agent-task.sh

      - name: Install latest release
        run: sh scripts/install.sh

      - name: Verify installed binary
        run: |
          "$HOME/.local/bin/devflow" --version
          "$HOME/.local/bin/devflow" --help > /dev/null

      - name: Install pinned version into custom dir
        run: |
          DEVFLOW_VERSION=v0.5.0 DEVFLOW_INSTALL_DIR="$RUNNER_TEMP/devflow-bin" sh scripts/install.sh
          "$RUNNER_TEMP/devflow-bin/devflow" --version | grep -F "0.5.0"

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs:
      - secrets
      - build-and-test
      - docker-tests
      - docker-services-tests
      - macos
    runs-on: ${{ matrix.os }}
    env:
      COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: devflow-linux-amd64
          - os: ubuntu-24.04-arm
            artifact_name: devflow-linux-arm64
          - os: macos-latest
            artifact_name: devflow-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install mold linker (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # Only the `devflow` CLI is released as a binary. The desktop app
      # (devflow-gui) is built from source.
      - name: Build release binary
        run: cargo build --locked --profile dist -p devflow --bin devflow
        env:
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=mold' || '' }}

      - name: Smoke test release binary
        run: |
          ./target/dist/devflow --version
          ./target/dist/devflow --help > /dev/null

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/dist/devflow dist/${{ matrix.artifact_name }}
          chmod +x dist/${{ matrix.artifact_name }}

      - name: Generate SHA256 checksums
        run: |
          cd dist
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          fi
          cat ${{ matrix.artifact_name }}.sha256

      - name: Install cosign (for signing)
        if: env.COSIGN_KEY != ''
        uses: sigstore/cosign-installer@v3

      - name: Sign release assets with cosign
        if: env.COSIGN_KEY != ''
        run: |
          cosign sign-blob --yes --key env://COSIGN_KEY \
            dist/${{ matrix.artifact_name }} \
            --output-signature dist/${{ matrix.artifact_name }}.sig \
            --output-certificate dist/${{ matrix.artifact_name }}.pem

      # Commitizen writes "## vX.Y.Z (date)" sections into CHANGELOG.md.
      - name: Extract release notes
        shell: bash
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## / {
              if (found) exit
              if (index($0, "## " tag " ") == 1 || $0 == "## " tag) found = 1
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md for the changes in ${GITHUB_REF_NAME}." > release-notes.md

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.sha256
            dist/${{ matrix.artifact_name }}.sig
            dist/${{ matrix.artifact_name }}.pem
          body_path: release-notes.md

  # Installs the published artifact with scripts/install.sh into a temporary
  # directory and runs the quick start in a scratch repository: the version
  # equals the tag, then init, switch -c, list and remove. After the release
  # job on a tag; by hand (workflow_dispatch) against a published release, whose
  # tag is required: "latest" is not accepted, so the version check always has
  # something to compare with.
  #
  # `release` is a matrix job: needs.release.result is "success" only when every
  # leg (Linux amd64, Linux arm64, macOS) has finished, uploads included, so a
  # tag run never starts before all the artifacts are there. A manual run has no
  # such guarantee, so the first step checks the release holds every asset.
  verify-install:
    name: Verify install script (${{ matrix.os }})
    if: >-
      !cancelled() && (
        (startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success')
        || github.event_name == 'workflow_dispatch'
      )
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    env:
      DEVFLOW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Require an explicit release tag
        run: |
          case "$DEVFLOW_VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "the release tag must look like v1.2.3, got '$DEVFLOW_VERSION'" >&2
              exit 1
              ;;
          esac

      - name: Check the release holds every artifact
        run: |
          assets="$(gh release view "$DEVFLOW_VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for asset in devflow-linux-amd64 devflow-linux-arm64 devflow-macos-arm64; do
            for name in "$asset" "$asset.sha256"; do
              if ! printf '%s\n' "$assets" | grep -Fxq "$name"; then
                echo "release $DEVFLOW_VERSION has no asset $name" >&2
                exit 1
              fi
            done
          done

      - name: Install the published release into a temporary directory
        run: |
          DEVFLOW_INSTALL_DIR="$RUNNER_TEMP/devflow-bin" sh scripts/install.sh

      - name: Version equals the tag, then the quick start
        run: sh scripts/smoke-test.sh "$RUNNER_TEMP/devflow-bin/devflow" "$DEVFLOW_VERSION"
